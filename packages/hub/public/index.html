<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Studio Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Roblox Studio Hub</h1>
      <div class="status" id="hubStatus">
        <span class="dot offline"></span>
        <span>...</span>
      </div>
    </header>

    <main>
      <section class="studios-section">
        <h2>Studio</h2>
        <div class="studios-list" id="studiosList">
          <div class="empty-state">No connections</div>
        </div>
      </section>

      <section class="tools-section">
        <div class="tools-header">
          <h2>Tools</h2>
          <div class="tool-selector" id="toolSelector"></div>
        </div>

        <div class="tool-form" id="toolForm">
          <div class="empty-state">Select a Studio to view available tools</div>
        </div>

        <div class="result-section">
          <h3>Result</h3>
          <div class="result-box" id="resultBox">Waiting...</div>
        </div>

        <div class="tool-web-section" id="toolWebSection" style="display:none">
          <h3>Plugin Page</h3>
          <iframe id="toolWebIframe" class="tool-iframe"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
